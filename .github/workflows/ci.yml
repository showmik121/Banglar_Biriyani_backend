# Runs automatically on every push (any branch) and every pull request.
# You can also start it by hand: Actions tab -> CI -> "Run workflow".
# See the result in the "Actions" tab of the GitHub repository.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (no database needed)
        run: npm run test:unit

  integration:
    name: Integration tests (Neon test database)
    runs-on: ubuntu-latest
    needs: test
    # On pushes and manual runs only, never on pull requests from forks, so secrets stay private.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      # Add these under Settings -> Secrets and variables -> Actions.
      # Point them at a separate Neon *test branch*, not your live database.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: ci-only-jwt-secret
      NODE_ENV: test
    steps:
      - name: Skip notice
        if: env.DATABASE_URL == ''
        run: echo "TEST_DATABASE_URL secret is not set, so integration tests are skipped."

      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''

      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.DATABASE_URL != ''
        run: npm ci

      - name: Prepare test database (schema + sample data)
        if: env.DATABASE_URL != ''
        run: |
          npx drizzle-kit push --force
          npm run db:seed

      - name: Integration tests
        if: env.DATABASE_URL != ''
        run: npm run test:integration

  supabase-edge:
    name: Supabase Edge Function build (Deno)
    runs-on: ubuntu-latest
    needs: test
    env:
      # Placeholder values: these checks never touch the database.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the Edge Function bundle
        run: node edge/build.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run the bundle in Deno
        # Production mode only here; npm ci above needs dev packages (esbuild).
        env:
          NODE_ENV: production
        run: deno run -A edge/smoke-test.mjs

  deploy:
    name: Deploy API to Supabase
    runs-on: ubuntu-latest
    # Only after the tests and the Edge build pass, and only for pushes to main.
    needs: [test, supabase-edge]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A newer push waits for this deploy instead of cancelling it halfway.
    concurrency:
      group: deploy-supabase
      cancel-in-progress: false
    env:
      # Scoped token (Edge Functions only). Add it under Settings -> Secrets and variables -> Actions.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip notice
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "SUPABASE_ACCESS_TOKEN secret is not set, so the automatic deploy is skipped."

      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm ci

      - name: Build the Edge Function bundle
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node edge/build.mjs

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest

      - name: Deploy the "api" function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          PROJECT_REF="$(tr -d '[:space:]' < supabase-project-id.txt)"
          supabase --version
          set +e
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Show the reason on the public run page (the full log needs sign-in)
            echo "::error title=Supabase deploy::$(tail -c 900 deploy.log | tr '\r\n' '  ')"
            exit "$status"
          fi

      - name: Check the live API
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          PROJECT_REF="$(tr -d '[:space:]' < supabase-project-id.txt)"
          for i in 1 2 3 4 5; do
            BODY="$(curl -s "https://$PROJECT_REF.supabase.co/functions/v1/api/health" || true)"
            echo "$BODY"
            echo "$BODY" | grep -q '"status":"ok"' && exit 0
            sleep 5
          done
          echo "::error title=Deploy check::The live API did not answer /health with status ok"
          exit 1
