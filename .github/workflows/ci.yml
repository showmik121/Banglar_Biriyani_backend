# Runs automatically on every push and pull request.
# See the result in the "Actions" tab of the GitHub repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Type check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (no database needed)
        run: npm run test:unit

  integration:
    name: Integration tests (Neon test database)
    runs-on: ubuntu-latest
    needs: test
    # Only on pushes to main, never on pull requests from forks, so secrets stay private.
    if: github.event_name == 'push'
    env:
      # Add these under Settings -> Secrets and variables -> Actions.
      # Point them at a separate Neon *test branch*, not your live database.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: ci-only-jwt-secret
      NODE_ENV: test
    steps:
      - name: Skip notice
        if: env.DATABASE_URL == ''
        run: echo "TEST_DATABASE_URL secret is not set, so integration tests are skipped."

      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''

      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.DATABASE_URL != ''
        run: npm ci

      - name: Prepare test database (schema + sample data)
        if: env.DATABASE_URL != ''
        run: |
          npx drizzle-kit push --force
          npm run db:seed

      - name: Integration tests
        if: env.DATABASE_URL != ''
        run: npm run test:integration
